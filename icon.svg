<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10243c"/>
      <stop offset="1" stop-color="#25506a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6cd96"/>
      <stop offset="1" stop-color="#c5a560"/>
    </linearGradient>
  </defs>
  <!-- Latar penuh: selamat untuk ikon "maskable" (Android memotong bentuknya sendiri) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Papan klip, dalam zon selamat tengah (bulatan 80%) -->
  <g transform="translate(256 256) scale(1.2) translate(-256 -246)">
  <rect x="156" y="132" width="200" height="248" rx="30" fill="url(#gold)"/>
  <rect x="210" y="112" width="92" height="46" rx="16" fill="#142b4a"/>
  <rect x="226" y="124" width="60" height="22" rx="9" fill="url(#gold)"/>
  <!-- Tanda semak -->
  <path d="M206 262 l36 36 l68 -76" fill="none" stroke="#142b4a" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
